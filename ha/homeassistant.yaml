# Home Assistant MQTT configuration for elster2mqtt (WPM 3 / WPL 15 AS)
# Add or merge this block in your Home Assistant configuration.yaml under `mqtt:`.
# The utility_meter: and template: blocks at the end of this file must be
# merged as TOP-LEVEL sections (NOT under mqtt:).

mqtt:
  sensor:
    # --- Operational State ---
    - name: "WPMS3 Betriebszustand"
      state_topic: "wpms3/status"
      icon: "mdi:heat-pump-outline"

    - name: "WPMS3 Aktive Komponenten"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.aktive_komponenten | join(', ') if value_json.aktive_komponenten else 'keine' }}"
      icon: "mdi:pump"

    # --- Temperatures ---
    - name: "WPMS3 Aussentemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.aussentemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Vorlaufisttemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.vorlaufisttemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Ruecklaufisttemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.ruecklaufisttemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Pufferisttemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.pufferisttemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Puffersolltemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.puffersolltemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    # --- Radiator Circuit (HK 2 - Sensor 2e Mischervorlauf) ---
    - name: "WPMS3 Radiator Vorlauf Ist (HK 2)"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.isttemperatur_hk_2 }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Radiator Vorlauf Soll (HK 2)"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.solltemperatur_hk_2 }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    # --- Domestic Hot Water ---
    - name: "WPMS3 Warmwasser Isttemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.warmwasser_isttemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Warmwasser Solltemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.warmwasser_solltemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    # --- Heating Curves & Setpoint ---
    - name: "WPMS3 Heizkurve HK 1 (Puffer)"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.heizkurve_hk_1 }}"
      icon: "mdi:chart-bell-curve"

    - name: "WPMS3 Heizkurve HK 2 (Radiatoren)"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.heizkurve_hk_2 }}"
      icon: "mdi:chart-bell-curve"

    - name: "WPMS3 Raumsolltemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.raumsolltemp_i }}"
      unit_of_measurement: "°C"
      device_class: temperature

    # --- Inverter Diagnostics (WPL 15 AS) ---
    - name: "WPMS3 Verdichter Drehzahl"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.istdrehzahl_verdichter }}"
      unit_of_measurement: "Hz"
      icon: "mdi:fan"

    - name: "WPMS3 Verdichter Solldrehzahl"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.solldrehzahl_verdichter }}"
      unit_of_measurement: "Hz"
      icon: "mdi:fan"

    - name: "WPMS3 Regelintegral"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.integral_regelabweichung }}"
      icon: "mdi:trending-up"

    - name: "WPMS3 Druck Hochdruck"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.druck_hochdruck }}"
      unit_of_measurement: "bar"
      icon: "mdi:gauge"

    - name: "WPMS3 Druck Niederdruck"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.druck_niederdruck }}"
      unit_of_measurement: "bar"
      icon: "mdi:gauge"

    - name: "WPMS3 Wasservolumenstrom"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.wp_wasservolumenstrom }}"
      unit_of_measurement: "l/min"
      icon: "mdi:water-pump"

    - name: "WPMS3 Spannung Inverter"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.spannung_inverter }}"
      unit_of_measurement: "V"
      icon: "mdi:flash"

    - name: "WPMS3 Strom Inverter"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.strom_inverter }}"
      unit_of_measurement: "A"
      icon: "mdi:flash"

    - name: "WPMS3 Spreizung"
      state_topic: "wpms3/info"
      value_template: "{{ (value_json.vorlaufisttemperatur - value_json.ruecklaufisttemperatur) | round(1) }}"
      unit_of_measurement: "K"
      icon: "mdi:thermometer-lines"

    - name: "WPMS3 Heissgastemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.heissgas_temp }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Starts Abtauung"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.starts_abtauung }}"
      state_class: total_increasing
      icon: "mdi:snowflake-melt"

    - name: "WPMS3 Laufzeit Verdichter Warmwasser"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.laufzeit_verdichter_ww }}"
      unit_of_measurement: "h"
      state_class: total_increasing

    # --- Today's Energy & COP ---
    - name: "WPMS3 Waermeertrag Heizen Tag"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.waermeertrag_heiz_tag_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy

    - name: "WPMS3 Stromverbrauch Heizen Tag"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.el_aufnahmeleistung_heiz_tag_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy

    - name: "WPMS3 COP Heizen Tag"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.cop_daily_heating | default('unavailable') }}"
      icon: "mdi:chart-line"

    # Daily DHW energy is NOT available from the controller (the register
    # pairs 500.092a/092b and 500.091a/091b are dead on firmware 390-08).
    # Instead, the all-time DHW totals below are tracked as total_increasing
    # counters and accumulated into daily values and a daily COP by the
    # utility_meter and template blocks at the end of this file. The
    # all-time heating counters live in the "All-Time Totals" section below.

    - name: "WPMS3 Total Waermeertrag Warmwasser"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.waermeertrag_ww_total_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "WPMS3 Total Stromverbrauch Warmwasser"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.el_aufnahmeleistung_ww_total_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    # --- Home Assistant Energy Dashboard Entities (All-Time Totals) ---
    - name: "WPMS3 Total Stromverbrauch"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.el_aufnahmeleistung_total_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "WPMS3 Total Waermeertrag"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.waermeertrag_total_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    # --- Lifetime Performance (JAZ) ---
    - name: "WPMS3 JAZ Total"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.jaz_total }}"
      icon: "mdi:gauge"

    - name: "WPMS3 JAZ Heizen"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.jaz_heizung }}"
      icon: "mdi:gauge"

    - name: "WPMS3 JAZ Warmwasser"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.jaz_warmwasser }}"
      icon: "mdi:gauge"

  binary_sensor:
    - name: "WPMS3 Verdichter Aktiv"
      state_topic: "wpms3/info"
      value_template: "{{ 'on' if value_json.verdichter_laeuft else 'off' }}"
      payload_on: "on"
      payload_off: "off"
      device_class: running

    - name: "WPMS3 Abtauung Aktiv"
      state_topic: "wpms3/info"
      value_template: "{{ 'on' if value_json.abtauung_aktiv else 'off' }}"
      payload_on: "on"
      payload_off: "off"
      device_class: cold

    - name: "WPMS3 Zusatzheizung Aktiv"
      state_topic: "wpms3/info"
      value_template: "{{ 'on' if value_json.zusatzheizung_aktiv else 'off' }}"
      payload_on: "on"
      payload_off: "off"
      device_class: heat

    # --- Betriebsphasen für den Temperaturverlauf im Dashboard ---
    - name: "WPMS3 Heizkreispumpe"
      state_topic: "wpms3/info"
      value_template: "{{ 'on' if 'heizkreispumpe' in value_json.aktive_komponenten else 'off' }}"
      payload_on: "on"
      payload_off: "off"
      device_class: running

    - name: "WPMS3 Warmwasserladung"
      state_topic: "wpms3/info"
      value_template: "{{ 'on' if 'warmwasserladepumpe' in value_json.aktive_komponenten else 'off' }}"
      payload_on: "on"
      payload_off: "off"
      device_class: running

# ---
# Daily DHW energy and COP (WPM 3 firmware 390-08 workaround)
#
# The controller's DHW daily registers (500.092a/092b, 500.091a/091b) are
# dead: the Wh word only holds values during an active DHW charge cycle and
# the kWh word is never populated. The all-time SUM registers are reliable,
# so daily DHW energy is accumulated here from their deltas. total_increasing
# on the source sensors already discards any counter reset (SUM decrement).
#
# Same merge instruction as above: add the utility_meter: and template: blocks
# as TOP-LEVEL sections (not under mqtt:), then reload via
# Developer Tools -> YAML (or restart Home Assistant).

utility_meter:
  wpms3_waermeertrag_warmwasser_heute:
    name: "WPMS3 Waermeertrag Warmwasser Heute"
    source: sensor.wpms3_total_waermeertrag_warmwasser
    cycle: daily

  wpms3_stromverbrauch_warmwasser_heute:
    name: "WPMS3 Stromverbrauch Warmwasser Heute"
    source: sensor.wpms3_total_stromverbrauch_warmwasser
    cycle: daily

template:
  # Daily DHW COP from the utility-meter deltas. Invalid until today's
  # electrical consumption reaches 1 kWh (avoids 0/0 early in the morning).
  # The availability check avoids has_value() so the block also works on
  # pre-2024.3 Home Assistant.
  - sensor:
      - name: "WPMS3 COP Warmwasser Heute"
        icon: "mdi:chart-line"
        state: >
          {% set w = states('sensor.wpms3_waermeertrag_warmwasser_heute') | float(0) %}
          {% set e = states('sensor.wpms3_stromverbrauch_warmwasser_heute') | float(0) %}
          {{ (w / e) | round(2) if e >= 1.0 else 'unavailable' }}
        availability: >-
          {{ states('sensor.wpms3_waermeertrag_warmwasser_heute') not in ['unknown', 'unavailable']
             and states('sensor.wpms3_stromverbrauch_warmwasser_heute') not in ['unknown', 'unavailable'] }}
