# Home Assistant Dashboard configuration for elster2mqtt (WPM 3 / WPL 15 AS)
#
# How to use:
# 1. In Home Assistant, go to Settings -> Dashboards -> Add Dashboard -> "New dashboard from scratch"
# 2. Open the new dashboard, click the three dots (...) top-right -> "Edit Dashboard"
# 3. Click the three dots (...) top-right again -> "Raw configuration editor"
# 4. Paste the content of this file and click Save.

title: Wärmepumpe
views:
  - title: Übersicht
    icon: mdi:heat-pump-outline
    cards:
      # ==========================================
      # Column 1: Status & Operation
      # ==========================================
      - type: vertical-stack
        cards:
          - type: entities
            title: Betriebszustand
            show_header_toggle: false
            entities:
              - entity: sensor.wpms3_betriebszustand
                name: Aktueller Zustand
                icon: mdi:heat-pump-outline
              - entity: sensor.wpms3_aktive_komponenten
                name: Aktive Komponenten
                icon: mdi:pump
              - entity: binary_sensor.wpms3_verdichter_aktiv
                name: Verdichter
              - entity: binary_sensor.wpms3_abtauung_aktiv
                name: Abtauung
              - entity: binary_sensor.wpms3_zusatzheizung_aktiv
                name: Zusatzheizung (NHZ)

          - type: gauge
            entity: sensor.wpms3_verdichter_drehzahl
            name: Verdichter Ist-Drehzahl
            min: 0
            max: 100
            unit: Hz
            needle: true
            severity:
              green: 20
              yellow: 60
              red: 85

          - type: entities
            title: Regelung
            show_header_toggle: false
            entities:
              - entity: sensor.wpms3_verdichter_solldrehzahl
                name: Verdichter Soll-Drehzahl
                icon: mdi:fan
              - entity: sensor.wpms3_regelintegral
                name: Regelintegral
                icon: mdi:trending-up

          - type: history-graph
            title: Betriebsstatus Verlauf (24h)
            hours_to_show: 24
            entities:
              - entity: sensor.wpms3_betriebszustand
                name: Betriebszustand
              - entity: binary_sensor.wpms3_verdichter_aktiv
                name: Verdichter Aktiv

      # ==========================================
      # Column 2: Efficiency & COP
      # ==========================================
      - type: vertical-stack
        cards:
          - type: gauge
            entity: sensor.wpms3_jaz_total
            name: All-Time JAZ
            min: 1
            max: 5
            needle: true
            severity:
              red: 2.5
              yellow: 3.2
              green: 3.8

          - type: gauge
            entity: sensor.wpms3_cop_heizen_tag
            name: COP Heizen Heute
            min: 1
            max: 6
            needle: true
            severity:
              red: 2.5
              yellow: 3.5
              green: 4.2

          - type: entities
            title: Energie Heute (kWh)
            show_header_toggle: false
            entities:
              - entity: sensor.wpms3_waermeertrag_heizen_tag
                name: Wärmeertrag Heizen
              - entity: sensor.wpms3_stromverbrauch_heizen_tag
                name: Stromverbrauch Heizen
              - entity: sensor.wpms3_cop_heizen_tag
                name: COP Heizen
              - entity: sensor.wpms3_waermeertrag_warmwasser_tag
                name: Wärmeertrag Warmwasser
              - entity: sensor.wpms3_stromverbrauch_warmwasser_tag
                name: Stromverbrauch Warmwasser
              - entity: sensor.wpms3_cop_warmwasser_tag
                name: COP Warmwasser

          - type: history-graph
            title: COP Tageswerte (7 Tage)
            hours_to_show: 168
            entities:
              - entity: sensor.wpms3_cop_heizen_tageswert
                name: COP Heizen
              - entity: sensor.wpms3_cop_warmwasser_tageswert
                name: COP Warmwasser

      # ==========================================
      # Column 3: Hydraulics & Tuning
      # ==========================================
      - type: vertical-stack
        cards:
          - type: entities
            title: Temperaturübersicht
            show_header_toggle: false
            entities:
              - entity: sensor.wpms3_aussentemperatur
                name: Aussentemperatur
              - entity: sensor.wpms3_vorlaufisttemperatur
                name: WP Vorlauf Ist
              - entity: sensor.wpms3_ruecklaufisttemperatur
                name: WP Rücklauf Ist
              - entity: sensor.wpms3_spreizung
                name: Spreizung (Vorlauf - Rücklauf)
              - entity: sensor.wpms3_pufferisttemperatur
                name: Puffer Ist
              - entity: sensor.wpms3_puffersolltemperatur
                name: Puffer Soll
              - entity: sensor.wpms3_radiator_vorlauf_ist_hk_2
                name: Radiator Vorlauf Ist (HK 2)
              - entity: sensor.wpms3_radiator_vorlauf_soll_hk_2
                name: Radiator Vorlauf Soll (HK 2)
              - entity: sensor.wpms3_warmwasser_isttemperatur
                name: Warmwasser Ist
              - entity: sensor.wpms3_warmwasser_solltemperatur
                name: Warmwasser Soll
              - entity: sensor.wpms3_raumsolltemperatur
                name: Raumsolltemperatur

          - type: entities
            title: Kältekreis
            show_header_toggle: false
            entities:
              - entity: sensor.wpms3_heissgastemperatur
                name: Heissgastemperatur
              - entity: sensor.wpms3_druck_hochdruck
                name: Druck Hochdruck
              - entity: sensor.wpms3_druck_niederdruck
                name: Druck Niederdruck
              - entity: sensor.wpms3_wasservolumenstrom
                name: Wasservolumenstrom
              - entity: sensor.wpms3_spannung_inverter
                name: Inverter Spannung
              - entity: sensor.wpms3_strom_inverter
                name: Inverter Strom

          - type: entities
            title: Heizkurven & Zähler
            show_header_toggle: false
            entities:
              - entity: sensor.wpms3_heizkurve_hk_1_puffer
                name: Heizkurve HK 1 (Puffer)
              - entity: sensor.wpms3_heizkurve_hk_2_radiatoren
                name: Heizkurve HK 2 (Radiatoren)
              - entity: sensor.wpms3_starts_abtauung
                name: Starts Abtauung Total
              - entity: sensor.wpms3_laufzeit_verdichter_warmwasser
                name: Verdichterlaufzeit Warmwasser

          - type: history-graph
            title: Temperaturverlauf (24h)
            hours_to_show: 24
            entities:
              - entity: sensor.wpms3_aussentemperatur
                name: Aussen
              - entity: sensor.wpms3_radiator_vorlauf_ist_hk_2
                name: Radiator Vorlauf (HK 2)
              - entity: sensor.wpms3_ruecklaufisttemperatur
                name: Rücklauf
              - entity: sensor.wpms3_pufferisttemperatur
                name: Puffer
              - entity: sensor.wpms3_warmwasser_isttemperatur
                name: Warmwasser
