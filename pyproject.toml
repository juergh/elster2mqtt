[project]
name = "elster2mqtt"
version = "0.2.3"
requires-python = ">= 3.13"
dependencies = [
    "paho-mqtt",
    "pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
elster2mqtt = "elster2mqtt.elster2mqtt:main"
