# Home Assistant MQTT configuration for elster2mqtt (WPM 3 / WPL 15 AS)
# Add or merge this block in your Home Assistant configuration.yaml under `mqtt:`.
# The utility_meter:, template: and sensor: blocks at the end of this file
# must be merged as TOP-LEVEL sections (NOT under mqtt:).

mqtt:
  sensor:
    # --- Operational State ---
    - name: "WPMS3 Betriebszustand"
      state_topic: "wpms3/status"
      icon: "mdi:heat-pump-outline"

    - name: "WPMS3 Aktive Komponenten"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.aktive_komponenten | join(', ') if value_json.aktive_komponenten else 'keine' }}"
      icon: "mdi:pump"

    # --- Temperatures ---
    - name: "WPMS3 Aussentemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.aussentemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Vorlaufisttemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.vorlaufisttemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Ruecklaufisttemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.ruecklaufisttemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Pufferisttemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.pufferisttemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Puffersolltemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.puffersolltemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    # --- Radiator Circuit (HK 2 - Sensor 2e Mischervorlauf) ---
    - name: "WPMS3 Radiator Vorlauf Ist (HK 2)"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.isttemperatur_hk_2 }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Radiator Vorlauf Soll (HK 2)"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.solltemperatur_hk_2 }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    # --- Domestic Hot Water ---
    - name: "WPMS3 Warmwasser Isttemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.warmwasser_isttemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Warmwasser Solltemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.warmwasser_solltemperatur }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    # --- Heating Curves & Setpoint ---
    - name: "WPMS3 Heizkurve HK 1 (Puffer)"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.heizkurve_hk_1 }}"
      icon: "mdi:chart-bell-curve"

    - name: "WPMS3 Heizkurve HK 2 (Radiatoren)"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.heizkurve_hk_2 }}"
      icon: "mdi:chart-bell-curve"

    - name: "WPMS3 Komforttemperatur HK 1 (Puffer)"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.komfort_temperatur_hk_1 }}"
      unit_of_measurement: "°C"
      device_class: temperature

    - name: "WPMS3 Komforttemperatur HK 2 (Radiatoren)"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.komfort_temperatur_hk_2 }}"
      unit_of_measurement: "°C"
      device_class: temperature

    # --- Inverter Diagnostics (WPL 15 AS) ---
    - name: "WPMS3 Verdichter Drehzahl"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.istdrehzahl_verdichter }}"
      unit_of_measurement: "Hz"
      icon: "mdi:fan"

    - name: "WPMS3 Verdichter Solldrehzahl"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.solldrehzahl_verdichter }}"
      unit_of_measurement: "Hz"
      icon: "mdi:fan"

    - name: "WPMS3 Regelintegral"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.integral_regelabweichung }}"
      icon: "mdi:trending-up"

    - name: "WPMS3 Druck Hochdruck"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.druck_hochdruck }}"
      unit_of_measurement: "bar"
      icon: "mdi:gauge"

    - name: "WPMS3 Druck Niederdruck"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.druck_niederdruck }}"
      unit_of_measurement: "bar"
      icon: "mdi:gauge"

    - name: "WPMS3 Wasservolumenstrom"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.wp_wasservolumenstrom }}"
      unit_of_measurement: "l/min"
      icon: "mdi:water-pump"

    - name: "WPMS3 Spannung Inverter"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.spannung_inverter }}"
      unit_of_measurement: "V"
      icon: "mdi:flash"

    - name: "WPMS3 Strom Inverter"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.strom_inverter }}"
      unit_of_measurement: "A"
      icon: "mdi:flash"

    - name: "WPMS3 Heissgastemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.heissgas_temp }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    # --- WP-interne Prozessdaten (node 500, display-verified) ---
    - name: "WPMS3 WP Ruecklauf"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.wp_ruecklauf_wpl }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Verdampfertemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.verdampfer_temp }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Fortlufttemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.fortluft_temp }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Sauggastemperatur"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.sauggas_temp }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "WPMS3 Druck Mitteldruck"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.druck_mitteldruck }}"
      unit_of_measurement: "bar"
      icon: "mdi:gauge"

    # --- Abgeleitete Werte ---
    - name: "WPMS3 WP Spreizung"
      state_topic: "wpms3/info"
      value_template: "{{ (value_json.vorlaufisttemperatur - value_json.wp_ruecklauf_wpl) | round(1) }}"
      unit_of_measurement: "K"
      icon: "mdi:thermometer-lines"

    - name: "WPMS3 COP Live"
      state_topic: "wpms3/info"
      value_template: >-
        {% if value_json.verdichter_laeuft and (value_json.wp_wasservolumenstrom | float) > 0 and (value_json.strom_inverter | float) > 0 %}
          {{ ((value_json.wp_wasservolumenstrom / 60 * 4.18 * (value_json.vorlaufisttemperatur - value_json.wp_ruecklauf_wpl)) / (value_json.spannung_inverter * value_json.strom_inverter / 1000)) | round(1) }}
        {% else %}
          unavailable
        {% endif %}
      icon: "mdi:gauge"

    - name: "WPMS3 Starts Abtauung"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.starts_abtauung }}"
      state_class: total_increasing
      icon: "mdi:snowflake-melt"

    - name: "WPMS3 Verdichter Starts"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.verdichter_starts }}"
      state_class: total_increasing
      icon: "mdi:counter"

    - name: "WPMS3 Laufzeit Verdichter Warmwasser"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.laufzeit_verdichter_ww }}"
      unit_of_measurement: "h"
      state_class: total_increasing

    # --- Today's Energy & COP ---
    - name: "WPMS3 Waermeertrag Heizen Tag"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.waermeertrag_heiz_tag_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy

    - name: "WPMS3 Aufnahmeleistung Heizen Tag"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.el_aufnahmeleistung_heiz_tag_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy

    - name: "WPMS3 COP Heizen Tag"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.cop_daily_heating | default('unavailable') }}"
      icon: "mdi:chart-line"

    - name: "WPMS3 Waermeertrag Warmwasser Tag"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.waermeertrag_ww_tag_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy

    - name: "WPMS3 Aufnahmeleistung Warmwasser Tag"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.el_aufnahmeleistung_ww_tag_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy

    - name: "WPMS3 COP Warmwasser Tag"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.cop_daily_ww | default('unavailable') }}"
      icon: "mdi:chart-line"

    # --- Home Assistant Energy Dashboard Entities (All-Time Totals) ---
    # The all-time DHW SUM totals below are day-start snapshots on firmware
    # 390-08 (frozen all day, jumping once at local midnight by the finished
    # day's amount), so they are only used for lifetime totals, not daily
    # values — the TAG registers above carry the live daily DHW values.

    - name: "WPMS3 Total Waermeertrag Warmwasser"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.waermeertrag_ww_total_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "WPMS3 Total Aufnahmeleistung Warmwasser"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.el_aufnahmeleistung_ww_total_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    # --- Home Assistant Energy Dashboard Entities (All-Time Totals) ---
    - name: "WPMS3 Total Aufnahmeleistung"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.el_aufnahmeleistung_total_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "WPMS3 Total Waermeertrag"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.waermeertrag_total_kwh }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    # --- Lifetime Performance (JAZ) ---
    - name: "WPMS3 JAZ Total"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.jaz_total }}"
      icon: "mdi:gauge"

    - name: "WPMS3 JAZ Heizen"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.jaz_heizung }}"
      icon: "mdi:gauge"

    - name: "WPMS3 JAZ Warmwasser"
      state_topic: "wpms3/info"
      value_template: "{{ value_json.jaz_warmwasser }}"
      icon: "mdi:gauge"

  binary_sensor:
    - name: "WPMS3 Verdichter Aktiv"
      state_topic: "wpms3/info"
      value_template: "{{ 'on' if value_json.verdichter_laeuft else 'off' }}"
      payload_on: "on"
      payload_off: "off"
      device_class: running

    - name: "WPMS3 Abtauung Aktiv"
      state_topic: "wpms3/info"
      value_template: "{{ 'on' if value_json.abtauung_aktiv else 'off' }}"
      payload_on: "on"
      payload_off: "off"
      device_class: cold

    - name: "WPMS3 Zusatzheizung Aktiv"
      state_topic: "wpms3/info"
      value_template: "{{ 'on' if value_json.zusatzheizung_aktiv else 'off' }}"
      payload_on: "on"
      payload_off: "off"
      device_class: heat

    # --- Betriebsphasen für den Temperaturverlauf im Dashboard ---
    # "Heizen" is keyed on the operating state (betriebszustand == 'heizen'),
    # NOT on the Heizkreispumpe relay bit (01d2 bit 4): that relay is
    # energized already during idle circulation on the combi-buffer schema
    # (observed 0x0230), so it would read "Running" 24/7 and convey nothing.
    - name: "WPMS3 Heizen (Radiatoren)"
      state_topic: "wpms3/info"
      value_template: "{{ 'on' if value_json.betriebszustand == 'heizen' else 'off' }}"
      payload_on: "on"
      payload_off: "off"
      device_class: running

    - name: "WPMS3 Warmwasserladung"
      state_topic: "wpms3/info"
      value_template: "{{ 'on' if 'warmwasserladepumpe' in value_json.aktive_komponenten else 'off' }}"
      payload_on: "on"
      payload_off: "off"
      device_class: running

# ---
# Daily compressor starts (the controller has no daily start counter, so a
# utility_meter counts the deltas of its all-time counter; not affected by
# the 5-minute bridge polling interval).
#
# Merge instruction: add the utility_meter: and template: blocks below as
# TOP-LEVEL sections (not under mqtt:), then reload via
# Developer Tools -> YAML (or restart Home Assistant).

utility_meter:
  wpms3_verdichter_starts_heute:
    name: "WPMS3 Verdichter Starts Heute"
    source: sensor.wpms3_verdichter_starts
    cycle: daily

template:
  # ---
  # Daily COP history for the "COP Tageswerte (7 Tage)" dashboard graph.
  # Snapshots of each day's final converged COP are stored in trigger-based
  # sensors so a 7-day rolling average (see the sensor: block below) can be
  # computed without clock or timezone fragility. Days where the COP never
  # became valid produce no sample, so averages cover valid days only.
  #
  # Both daily COP sources are unavailable for part of the morning (the
  # el < 1 kWh guard), so the snapshots below read from "Merker" holders
  # that always carry the LAST NUMERIC COP of their source. At every
  # snapshot moment the holders are guaranteed to hold the previous day's
  # converged value: today's COP only becomes numeric again after the
  # counters have reset AND at least 1 kWh has accumulated, which is
  # always later than the snapshot.
  - trigger:
      - platform: state
        entity_id: sensor.wpms3_cop_heizen_tag
    sensor:
      - name: "WPMS3 COP Heizen Merker"
        state: "{{ trigger.to_state.state if trigger.to_state.state | is_number else this.state if this.state | is_number }}"
        state_class: measurement

  - trigger:
      - platform: state
        entity_id: sensor.wpms3_cop_warmwasser_tag
    sensor:
      - name: "WPMS3 COP Warmwasser Merker"
        state: "{{ trigger.to_state.state if trigger.to_state.state | is_number else this.state if this.state | is_number }}"
        state_class: measurement

  # Heating snapshot: fires once per day on the WPM's own daily counter
  # rollover, detected as a NUMERIC nonzero -> ~0 transition (an exact
  # `to: "0"` string match never fires, because the JSON value renders as
  # "0.0"). Note: the triggering entity is the MQTT sensor "WPMS3
  # Waermeertrag Heizen Tag" — its entity id is
  # sensor.wpms3_waermeertrag_heizen_tag, NOT the raw JSON key.
  #
  # IMPORTANT: a sensor with state_class: measurement must only ever hold
  # numeric states, so the fallback renders NOTHING (state unchanged)
  # instead of assigning the string 'unknown' — assigning it makes the
  # sensor platform raise ValueError and take down the core.
  - trigger:
      - platform: state
        entity_id: sensor.wpms3_waermeertrag_heizen_tag
    sensor:
      - name: "WPMS3 COP Heizen Tageswert"
        state: >
          {% set prev = (trigger.from_state.state | float(-1)) if trigger.from_state else -1 %}
          {% set now = trigger.to_state.state | float(-1) %}
          {% if prev > 0 and now < 0.001 %}
            {% set m = states('sensor.wpms3_cop_heizen_merker') %}
            {{ m if m | is_number else (this.state if this.state | is_number) }}
          {% else %}
            {{ this.state if this.state | is_number }}
          {% endif %}
        state_class: measurement

  # DHW snapshot: same pattern on the controller's live DHW daily counter
  # (registers 500.092a/092b, reset by the controller at local midnight).
  - trigger:
      - platform: state
        entity_id: sensor.wpms3_waermeertrag_warmwasser_tag
    sensor:
      - name: "WPMS3 COP Warmwasser Tageswert"
        state: >
          {% set prev = (trigger.from_state.state | float(-1)) if trigger.from_state else -1 %}
          {% set now = trigger.to_state.state | float(-1) %}
          {% if prev > 0 and now < 0.001 %}
            {% set m = states('sensor.wpms3_cop_warmwasser_merker') %}
            {{ m if m | is_number else (this.state if this.state | is_number) }}
          {% else %}
            {{ this.state if this.state | is_number }}
          {% endif %}
        state_class: measurement

  # ---
  # Average compressor cycle length today (runtime / starts). Starts
  # come from the exact internal counter; runtime is history_stats-based
  # and still subject to the 5-minute polling interval (±a few min/day).
  - sensor:
      - name: "WPMS3 Verdichter Mittlere Laufzeit"
        unit_of_measurement: "min"
        state: >
          {% set s = states('sensor.wpms3_verdichter_starts_heute') | int(0) %}
          {% set h = states('sensor.wpms3_verdichter_laufzeit_heute') | float(0) %}
          {{ (h * 60 / s) | round(0) if s > 0 else 0 }}

  # ---
  # BGC booster guard: flags when the tank sits well above the WPM WW
  # setpoint. The heat pump never exceeds the WW setpoint (+hysteresis),
  # so a tank temperature a couple of K above it means the electric
  # immersion heater (Einschraubheizkörper BGC) is running again —
  # usually because its thermostat knob was turned back up.
  - binary_sensor:
      - name: "WPMS3 WW Booster Aktiv"
        state: "{{ 'on' if states('sensor.wpms3_warmwasser_isttemperatur') | float(0) > (states('sensor.wpms3_warmwasser_solltemperatur') | float(0)) + 2 else 'off' }}"
        device_class: heat

# ---
# 7-day rolling averages over the daily COP snapshots computed above.
# `entity_id:` (rather than `source:`) is the correct key for the legacy
# statistics sensor platform and still accepted as of Home Assistant
# 2026.10.4.
sensor:
  - platform: statistics
    name: "WPMS3 COP Heizen 7 Tage Mittel"
    entity_id: sensor.wpms3_cop_heizen_tageswert
    state_characteristic: mean
    max_age:
      days: 7

  - platform: statistics
    name: "WPMS3 COP Warmwasser 7 Tage Mittel"
    entity_id: sensor.wpms3_cop_warmwasser_tageswert
    state_characteristic: mean
    max_age:
      days: 7

# ---
# Compressor runtime from the verdichter_laeuft flag (starts come from
# the exact internal counter via the utility_meter above). Caveat: the
# bridge polls every 5 minutes, so short on-periods can be missed and
# the runtime is approximate (±a few min/day); trends are meaningful.
  - platform: history_stats
    name: "WPMS3 Verdichter Laufzeit Heute"
    entity_id: binary_sensor.wpms3_verdichter_aktiv
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: statistics
    name: "WPMS3 COP Live Tagesmittel"
    entity_id: sensor.wpms3_cop_live
    state_characteristic: mean
    max_age:
      hours: 24
